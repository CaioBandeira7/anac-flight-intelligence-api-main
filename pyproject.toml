[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anac-flight-intelligence"
version = "2.0.0.dev0"
description = "Reproducible data and ML platform built on ANAC (Brazil) air transport microdata."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "polars>=2.1,<3",
    "duckdb>=2.0,<3",
    "psutil>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.17",
    "mypy>=2.0",
    "types-psutil",
]

[project.scripts]
anac-ingest = "anac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: reads the real CSV in data/raw (skipped when the file is absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "00_verificar_dados.py",
    "01_ingestao.py",
    "02_feature_engineering.py",
    "03_modelo_aeroporto.py",
    "04_modelo_assentos.py",
    "05_modelos_preco_bagagem.py",
    "06_api.py",
    "07_monitorar_drift.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings and report prose read better unwrapped.
"scripts/*" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
